<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B33">
<title>Bills Hub · Paytm prototype</title>
<meta name="description" content="Bills Hub: one calendar for every recurring payment in the family. Clickable prototype by Kirti Agarwal, MDI Gurgaon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>

body{margin:0}
*{box-sizing:border-box}
.app{width:390px;height:844px;position:relative;overflow:hidden;background:#F4F7FB;font-family:Inter,system-ui,-apple-system,sans-serif;color:#0B1B33;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.stage{flex:1 1 auto;position:relative;min-height:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#F4F7FB}
.scroll{flex:1 1 auto;overflow-y:auto;min-height:0;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.bar{height:60px;flex:0 0 60px;display:flex;align-items:center;gap:4px;padding:8px 12px 0}
.bar h1{margin:0;font-size:17px;line-height:22px;font-weight:600}
.ib{width:44px;height:44px;flex:0 0 44px;border:0;background:transparent;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#0B1B33;cursor:pointer;padding:0}
.ib:hover{background:#E9EEF5}
.card{background:#fff;border-radius:16px;border:1px solid #E3E9F1}
button.card{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.btn{height:52px;width:100%;border:0;border-radius:14px;font:600 16px/20px Inter,system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;transition:background .15s}
.pri{background:#002E6E;color:#fff}
.pri:hover{background:#0A3D85}
.pri:disabled{background:#C3CEDC;cursor:not-allowed}
.sec{background:#fff;color:#002E6E;box-shadow:inset 0 0 0 1.5px #002E6E}
.sec:hover{background:#F0F5FB}
.ghost{background:transparent;color:#002E6E}
.foot{flex:0 0 auto;padding:12px 20px 20px;background:#fff;border-top:1px solid #E3E9F1;display:flex;flex-direction:column;gap:8px}
.tile{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.muted{color:#5B6B82}
.h2{margin:0;font-size:24px;line-height:30px;font-weight:700;letter-spacing:-0.015em}
.lbl{font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#5B6B82}
.row{display:flex;align-items:center;gap:12px}
.chip{height:36px;padding:0 16px;border-radius:18px;border:1px solid #D5DEE9;background:#fff;font:500 14px/18px Inter,system-ui,sans-serif;color:#0B1B33;cursor:pointer;flex:0 0 auto}
.chip.on{background:#002E6E;border-color:#002E6E;color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;line-height:16px;white-space:nowrap}
.check{width:24px;height:24px;flex:0 0 24px;border-radius:7px;border:2px solid #B7C3D3;display:flex;align-items:center;justify-content:center;color:#fff;background:#fff}
.check.on{background:#002E6E;border-color:#002E6E}
.radio{width:22px;height:22px;flex:0 0 22px;border-radius:11px;border:2px solid #B7C3D3;display:flex;align-items:center;justify-content:center}
.radio.on{border-color:#002E6E}
.radio.on span{width:10px;height:10px;border-radius:5px;background:#002E6E}
.switch{width:48px;height:28px;flex:0 0 48px;border-radius:14px;border:0;background:#C3CEDC;position:relative;cursor:pointer;padding:0;transition:background .2s}
.switch span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(11,27,51,.2)}
.switch.on{background:#002E6E}
.switch.on span{left:23px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;line-height:16px;font-weight:600;color:#33445C}
.input{height:52px;border:1.5px solid #D5DEE9;border-radius:12px;background:#fff;display:flex;align-items:center;padding:0 14px;gap:10px}
.input:focus-within{border-color:#002E6E}
.input input{border:0;outline:none;flex:1;font:500 16px/20px Inter,system-ui,sans-serif;color:#0B1B33;background:transparent;min-width:0;height:48px;padding:0}
.input input::placeholder{color:#8593A6}
.lb{width:100%;background:#fff;border:0;border-bottom:1px solid #EEF2F6;text-align:left;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;font:inherit;color:inherit;min-height:72px}
.lb:hover{background:#F8FAFC}
.lst{overflow:hidden}
.lst > *:last-child .lb, .lst > .lb:last-child{border-bottom:0}
.spin{width:18px;height:18px;border-radius:9px;border:2.5px solid #D5E9F5;border-top-color:#00BAF2;animation:sp .8s linear infinite;flex:0 0 18px}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.nav{flex:0 0 72px;height:72px;background:#fff;border-top:1px solid #E3E9F1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 8px 6px}
.nb{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 11px/14px Inter,system-ui,sans-serif;cursor:pointer;padding:0}
.t15{font-size:15px;line-height:20px;font-weight:600}
.t13{font-size:13px;line-height:18px}
.div{height:1px;background:#EEF2F6}

html,body{height:100%}
body{background:#0B1B33;font-family:Inter,system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:56px}
#side{color:#fff;max-width:320px}
#side .eyebrow{font-size:12px;letter-spacing:.12em;font-weight:600;color:#7FD3F2;text-transform:uppercase}
#side h1{font-size:40px;line-height:46px;margin:10px 0 8px;letter-spacing:-.02em}
#side p{color:#B9C7D8;font-size:15px;line-height:23px;margin:0 0 18px}
#side .by{color:#fff;font-weight:600;font-size:14px}
#side .reset{margin-top:22px;background:transparent;border:1px solid #3B5878;color:#fff;border-radius:10px;height:40px;padding:0 16px;font:600 14px Inter,sans-serif;cursor:pointer}
#side .reset:hover{background:#16314F}
#phone{position:relative;width:410px;height:864px;border-radius:44px;background:#05101F;padding:10px;box-shadow:0 30px 80px rgba(0,0,0,.45);transform-origin:center center;flex:0 0 auto}
#phone #root{width:390px;height:844px;border-radius:34px;overflow:hidden;background:#F4F7FB}
@media (max-width:820px){#side{display:none}}
@media (max-width:500px){
  body{background:#F4F7FB}
  #wrap{display:block}
  #phone{padding:0;border-radius:0;background:transparent;box-shadow:none;transform-origin:top left;position:absolute;left:0;top:0}
  #phone #root{border-radius:0}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="side">
    <div class="eyebrow">Paytm product case · Recharge engagement</div>
    <h1>Bills Hub</h1>
    <p>One calendar for every recurring payment in the family. Start with one mobile number, link family, add any bill, then pay in full, split or together.</p>
    <div class="by">Kirti Agarwal · MDI Gurgaon</div>
    <button class="reset" id="restart" type="button">Restart prototype</button>
  </div>
  <div id="phone"><div id="root"></div></div>
</div>
<template id="tpl">
<div class="app">
<div class="stage">
<sc-if value="{{ s.start }}" hint-placeholder-val="{{ true }}">
<div class="screen" style="background:#fff">
  <div class="scroll" style="padding:40px 24px 24px;display:flex;flex-direction:column;gap:28px">
    <div class="row" style="gap:10px">
      <div class="tile" style="width:40px;height:40px;flex-basis:40px;border-radius:12px;background:#002E6E;color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></svg></div>
      <span style="font-size:15px;line-height:20px;font-weight:700;color:#002E6E">Bills Hub</span>
    </div>
    <div>
      <h1 style="margin:0;font-size:30px;line-height:36px;font-weight:700;letter-spacing:-0.02em">All your recurring payments in one calendar</h1>
      <p class="muted" style="margin:12px 0 0;font-size:15px;line-height:22px">Enter your number. We’ll find the mobile, DTH and LPG accounts linked to it. You can add any other bill after that.</p>
    </div>
    <div class="field">
      <label for="my-phone">Your primary mobile number</label>
      <div class="input"><span style="font-size:16px;font-weight:600;color:#33445C">+91</span><span style="width:1px;height:24px;background:#D5DEE9"></span><input id="my-phone" type="tel" inputMode="numeric" placeholder="10-digit number" value="{{ myPhone }}" onChange="{{ onMyPhone }}"></div>
      <span class="t13 muted">Demo: any 10 digits works</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="lbl">We’ll look for</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <span class="pill" style="height:32px;padding:0 12px;font-size:13px;gap:6px;background:#E5F6FD;color:#00698F"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg>Mobile</span>
        <span class="pill" style="height:32px;padding:0 12px;font-size:13px;gap:6px;background:#EEF0FF;color:#4338CA"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="7" width="19" height="13" rx="2.5"/><path d="M16 3l-4 4-4-4"/></svg>DTH</span>
        <span class="pill" style="height:32px;padding:0 12px;font-size:13px;gap:6px;background:#FFF0E5;color:#B4480A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a6.5 6.5 0 0 0 6.5-6.5c0-4.5-3.5-7-4.5-11-2 1.5-3.5 4-3.5 6.5-1-.5-2-2-2-3.5C7 9.5 5.5 12 5.5 15.5A6.5 6.5 0 0 0 12 22z"/></svg>LPG</span>
        <span class="pill" style="height:32px;padding:0 12px;font-size:13px;gap:6px;background:#F1F4F8;color:#33445C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add electricity, water and more later</span>
      </div>
    </div>
    <button class="card" onClick="{{ toggleConsent }}" aria-pressed="{{ consent }}" style="display:flex;gap:12px;padding:16px;align-items:flex-start">
      <span class="check {{ consentCls }}" style="margin-top:1px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></span>
      <span style="font-size:13px;line-height:19px;color:#33445C">I allow Paytm to fetch plan and bill details linked to this number from these providers through Bharat Connect. I can turn this off anytime.</span>
    </button>
  </div>
  <div class="foot"><button class="btn pri" disabled="{{ startInvalid }}" onClick="{{ sendMyOtp }}">Get OTP</button></div>
</div>
</sc-if>
<sc-if value="{{ s.meOtp }}" hint-placeholder-val="{{ false }}">
<div class="screen">
  <div class="bar"><button class="ib" aria-label="Back" onClick="{{ back }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><h1>Verify your number</h1></div>
  <div class="scroll" style="padding:8px 20px 24px;display:flex;flex-direction:column;gap:24px">
    <div><h2 class="h2">Enter the 4-digit code</h2><p class="muted" style="margin:8px 0 0;font-size:15px;line-height:22px">Sent by SMS to +91 {{ myPhoneFmt }}.</p></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="position:relative">
        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
          <sc-for list="{{ myOtpBoxes }}" as="d" hint-placeholder-count="4"><div style="height:64px;border-radius:14px;background:#fff;border:2px solid {{ d.border }};display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700">{{ d.ch }}</div></sc-for>
        </div>
        <label for="my-otp" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">One-time code</label>
        <input id="my-otp" type="tel" inputMode="numeric" autoComplete="one-time-code" value="{{ myOtp }}" onChange="{{ onMyOtp }}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;cursor:text">
      </div>
      <div class="row" style="justify-content:space-between"><span class="t13 muted">Demo: any 4 digits</span><button style="border:0;background:transparent;font:600 13px/18px Inter,sans-serif;color:#002E6E;height:44px;cursor:pointer;padding:0" onClick="{{ resend }}">Resend code</button></div>
    </div>
  </div>
  <div class="foot"><button class="btn pri" disabled="{{ myOtpInvalid }}" onClick="{{ scanMe }}">Verify and find my bills</button></div>
</div>
</sc-if>
<sc-if value="{{ s.scanning }}" hint-placeholder-val="{{ false }}">
<div class="screen" style="background:#fff">
  <div class="bar"></div>
  <div class="scroll" style="padding:0 20px 24px">
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 28px">
      <div style="width:64px;height:64px;border-radius:32px;border:4px solid #E3F4FC;border-top-color:#00BAF2;animation:sp 1s linear infinite"></div>
      <h1 style="margin:20px 0 4px;font-size:20px;line-height:26px;font-weight:700">{{ scanTitle }}</h1>
      <p class="muted" style="margin:0;font-size:14px;line-height:20px">{{ scanSub }}</p>
    </div>
    <div class="card lst">
      <sc-for list="{{ scanList }}" as="p" hint-placeholder-count="7">
        <div class="row" style="height:56px;padding:0 16px;justify-content:space-between;border-bottom:1px solid {{ p.line }}">
          <div class="row" style="gap:12px"><div class="tile" style="width:32px;height:32px;flex-basis:32px;border-radius:9px;background:{{ p.bg }};color:{{ p.fg }}"><sc-if value="{{ p.isMobile }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg></sc-if><sc-if value="{{ p.isDth }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="7" width="19" height="13" rx="2.5"/><path d="M16 3l-4 4-4-4"/></svg></sc-if><sc-if value="{{ p.isLpg }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a6.5 6.5 0 0 0 6.5-6.5c0-4.5-3.5-7-4.5-11-2 1.5-3.5 4-3.5 6.5-1-.5-2-2-2-3.5C7 9.5 5.5 12 5.5 15.5A6.5 6.5 0 0 0 12 22z"/></svg></sc-if><sc-if value="{{ p.isElec }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg></sc-if><sc-if value="{{ p.isWater }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5s6.5 7 6.5 12a6.5 6.5 0 0 1-13 0c0-5 6.5-12 6.5-12z"/></svg></sc-if><sc-if value="{{ p.isBb }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.6a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1"/></svg></sc-if><sc-if value="{{ p.isGas }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14l3.5-3.5"/><path d="M3.5 18a9 9 0 1 1 17 0z"/></svg></sc-if></div><span style="font-size:15px;font-weight:500">{{ p.name }}</span></div>
          <sc-if value="{{ p.isPending }}" hint-placeholder-val="{{ true }}"><span style="width:8px;height:8px;border-radius:4px;background:#D5DEE9"></span></sc-if>
          <sc-if value="{{ p.isChecking }}" hint-placeholder-val="{{ false }}"><span class="spin"></span></sc-if>
          <sc-if value="{{ p.isFound }}" hint-placeholder-val="{{ false }}"><span class="pill" style="background:#E7F6EE;color:#0A7A43"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>Found</span></sc-if>
          <sc-if value="{{ p.isNone }}" hint-placeholder-val="{{ false }}"><span class="t13 muted">Not linked</span></sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</sc-if>
<sc-if value="{{ s.found }}" hint-placeholder-val="{{ false }}">
<div class="screen">
  <div class="bar"><button class="ib" aria-label="Back" onClick="{{ back }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><h1>Your accounts</h1></div>
  <div class="scroll" style="padding:8px 20px 24px;display:flex;flex-direction:column;gap:20px">
    <div><h2 class="h2">We found 2 accounts on your number</h2><p class="muted" style="margin:8px 0 0;font-size:15px;line-height:22px">Check the name on each one before adding it.</p></div>
    <div class="card lst">
      <sc-for list="{{ meFound }}" as="a" hint-placeholder-count="2">
<button class="lb" onClick="{{ a.toggle }}" aria-pressed="{{ a.on }}">
  <div class="tile" style="background:{{ a.bg }};color:{{ a.fg }}"><sc-if value="{{ a.isMobile }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg></sc-if><sc-if value="{{ a.isDth }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="7" width="19" height="13" rx="2.5"/><path d="M16 3l-4 4-4-4"/></svg></sc-if><sc-if value="{{ a.isLpg }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a6.5 6.5 0 0 0 6.5-6.5c0-4.5-3.5-7-4.5-11-2 1.5-3.5 4-3.5 6.5-1-.5-2-2-2-3.5C7 9.5 5.5 12 5.5 15.5A6.5 6.5 0 0 0 12 22z"/></svg></sc-if><sc-if value="{{ a.isElec }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg></sc-if><sc-if value="{{ a.isWater }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5s6.5 7 6.5 12a6.5 6.5 0 0 1-13 0c0-5 6.5-12 6.5-12z"/></svg></sc-if><sc-if value="{{ a.isBb }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.6a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1"/></svg></sc-if><sc-if value="{{ a.isGas }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14l3.5-3.5"/><path d="M3.5 18a9 9 0 1 1 17 0z"/></svg></sc-if></div>
  <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px">
    <span class="t15">{{ a.provider }}</span>

  function same(a, b) { return a.nodeType === b.nodeType && a.nodeName === b.nodeName; }
  function patchNode(o, n) {
    if (o.nodeType === 3) { if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue; return; }
    Array.from(o.attributes).forEach(function (a) { if (!n.hasAttribute(a.name)) o.removeAttribute(a.name); });
    Array.from(n.attributes).forEach(function (a) { if (o.getAttribute(a.name) !== a.value) o.setAttribute(a.name, a.value); });
    o._h = n._h;
    if (o.tagName === 'INPUT') {
      var want = n.getAttribute('value') || '';
      if (o.value !== want) o.value = want;
      o.disabled = n.hasAttribute('disabled');
    }
    if (o.tagName === 'BUTTON') o.disabled = n.hasAttribute('disabled');
    patchChildren(o, n);
  }
  function patchChildren(o, n) {
    var oc = Array.from(o.childNodes), nc = Array.from(n.childNodes);
    for (var i = 0; i < nc.length; i++) {
      if (!oc[i]) o.appendChild(nc[i]);
      else if (!same(oc[i], nc[i])) o.replaceChild(nc[i], oc[i]);
      else patchNode(oc[i], nc[i]);
    }
    for (var j = nc.length; j < oc.length; j++) o.removeChild(oc[j]);
  }

  // ---------- Gemini summary (server-side; falls back to the built-in text) ----------
  var AI = {};
  function askGemini(key, facts) {
    AI[key] = { loading: true };
    fetch('/api/summary', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ facts: facts }) })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.short && d.points && d.points.length) AI[key] = { short: d.short, points: d.points };
        else AI[key] = { failed: true };
        schedule();
      })
      .catch(function () { AI[key] = { failed: true }; });
  }
  function withAI(vals, screen) {
    if (!vals.aiPoints) return vals;
    var facts = vals.aiPoints.map(function (p) { return p.text; });
    var key = JSON.stringify(facts);
    var hit = AI[key];
    if (!hit && (screen === 'hub' || screen === 'insights')) askGemini(key, facts);
    if (hit && hit.short) {
      vals.aiShort = hit.short;
      vals.aiPoints = hit.points.map(function (t) { return { text: t }; });
    }
    var regen = vals.regen;
    vals.regen = function (e) { delete AI[key]; askGemini(key, facts); if (regen) regen(e); };
    return vals;
  }

  // ---------- app ----------
  var root = document.getElementById('root');
  var tpl = document.getElementById('tpl');
  var params = new URLSearchParams(location.search);
  var comp = new Component({ start: params.get('start') || 'start' });
  var lastScreen = null, queued = false;

  function render() {
    queued = false;
    var screen = comp.state && comp.state.screen;
    var vals = withAI(comp.renderVals(), screen);
    var frag = document.createElement('div');
    tpl.content.childNodes.forEach(function (n) { build(frag, n, vals); });
    if (screen !== lastScreen) { root.innerHTML = ''; while (frag.firstChild) root.appendChild(frag.firstChild); }
    else patchChildren(root, frag);
    lastScreen = screen;
  }
  function schedule() { if (!queued) { queued = true; Promise.resolve().then(render); } }
  window.__schedule = schedule;

  function dispatch(type) {
    return function (ev) {
      var stopped = false;
      var e = { type: type, target: ev.target, nativeEvent: ev, preventDefault: function () { ev.preventDefault(); }, stopPropagation: function () { stopped = true; } };
      for (var el = ev.target; el && el !== root.parentNode; el = el.parentNode) {
        if (el._h && el._h[type]) { e.currentTarget = el; el._h[type](e); if (stopped) break; }
      }
    };
  }
  root.addEventListener('click', dispatch('click'));
  root.addEventListener('input', dispatch('input'));

  var restart = document.getElementById('restart');
  if (restart) restart.addEventListener('click', function () { comp.state = seed('start'); lastScreen = null; render(); });

  var phone = document.getElementById('phone');
  function fit() {
    var w = innerWidth, h = innerHeight, s;
    if (w <= 500) {
      s = Math.min(w / 390, h / 844);
      phone.style.transform = 'scale(' + s + ')';
      phone.style.left = Math.max(0, (w - 390 * s) / 2) + 'px';
    } else {
      s = Math.min(1, (h - 32) / 864);
      phone.style.transform = 'scale(' + s + ')';
      phone.style.left = '';
    }
  }
  addEventListener('resize', fit);
  fit();
  render();
})();

</script>
</body>
